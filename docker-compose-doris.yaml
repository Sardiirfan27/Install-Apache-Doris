services:
  fe-1:
    image: ${DORIS_IMAGE:-apache/doris:all-in-one-4.1.3}
    container_name: "doris-fe-1"
    hostname: "fe-1"
    stop_grace_period: 60s

    environment:
      DORIS_ROLE: fe
      FE_HEAP: ${FE_HEAP:-1024m}

    ports:
      - "${FE_PORT:-9030}:9030" # Port koneksi SQL host port default 9030, container port 9030
      - "${FE_HTTP_PORT:-8030}:8030" # Port untuk HTTP (Web UI dan HTTP API)

    volumes:
      # Penyimpanan data FE
      - ./data/fe-01/doris-meta:/opt/apache-doris/fe/doris-meta
      - ./data/fe-01/log:/opt/apache-doris/fe/log

    networks:
      doris:
        ipv4_address: ${SUBNET:-172.31.81}.40

  be-1:
    image: apache/doris-be-python:4.1.3

    build:
      context: .
      dockerfile: Dockerfile.be

    container_name: "doris-be-1"
    hostname: "be-1"
    stop_grace_period: 60s

    depends_on:
      fe-1:
        condition: service_healthy

    environment:
      DORIS_ROLE: be
      FE_MASTER: fe-1
      BE_CONFIG_EXTRA: |-
        mem_limit = ${BE_MEM_LIMIT:-25%}
        enable_python_udf_support = true
        python_env_mode = conda
        python_conda_root_path = /opt/miniforge3

    ports:
      - "${BE_HTTP_PORT:-8040}:8040"

    volumes:
      # Penyimpanan data BE
      - ./data/be-01/storage:/opt/apache-doris/be/storage
      - ./data/be-01/log:/opt/apache-doris/be/log

    networks:
      doris:
        ipv4_address: ${SUBNET:-172.31.81}.50

networks:
  doris:
    driver: bridge
    ipam: 
      config:
        - subnet: ${SUBNET:-172.31.81}.0/24
